[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
# WHY: two kinds of test are excluded from a plain `pytest`, because both burn
# real time and real quota when someone is only checking a change:
#
#   live - the 9 tests in tests/test_live_providers.py call OpenRouter, Pexels
#          and Pixabay over the real network using the API keys in your
#          environment. Selected tests in tests/test_e2e.py hit the network too.
#   slow - the /api/build-video tests in tests/test_e2e.py drive a real
#          HyperFrames render (npx + chrome-headless-shell + ffmpeg, measured at
#          ~316s for one 41s 1080x1920 cut), plus real Pexels/Pixabay media
#          search. The /api/strategy tests in that file make real free-tier
#          model calls (13-60s each).
#
# tests/test_e2e.py also starts a real uvicorn server through a session
# fixture. That boot is a couple of seconds, not minutes, so its health,
# providers, frontend and auth-contract tests are NOT marked slow and stay in
# the fast default run on purpose.
#
# Do NOT remove the -m below to "fix" a red build: the excluded tests are
# green, they are just expensive by design.
#
# HOW TO RUN EACH COMBINATION:
#   pytest                              # default: fast, offline, no render
#   pytest -m "not slow and not live"   # explicit form of the default
#   pytest -m slow                      # only the slow ones
#   pytest -m live                      # only the real-network ones
#   pytest -m "slow and live"           # only the tests that are both
#   pytest -m "not live"                # fast + slow renders, no external calls
#
# Why an explicit -m still overrides this: pytest prepends addopts to the
# command line (Config._initini does args[:] = getini("addopts") + args) and
# -m is a plain argparse "store" option, so the LAST -m on the effective
# command line WINS and REPLACES the default instead of being ANDed with it.
# Proven on pytest 9.1.1 with --collect-only (which executes nothing): an
# explicit -m "slow or live" collects the union of both sets, whereas an
# ANDed default would have collapsed
# "not slow and not live and (slow or live)" to 0 collected tests.
addopts = -m "not slow and not live"
markers =
    slow: drives a real render or a real slow call; deselected by default, run with -m slow
    live: hits real external AI/media providers; deselected by default, run with -m live
