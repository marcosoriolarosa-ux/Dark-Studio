<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Dark Studio · Do tema ao video</title>
    <meta
      name="description"
      content="Dark Studio: escreva um tema, gere a voz, componha as legendas e renderize o video."
    />
    <!-- Relative paths on purpose: the server mounts this folder at /app/, and
         the API lives on the same origin, so no absolute URL and no CDN. -->
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1015'/%3E%3Crect x='6' y='5' width='20' height='22' rx='4' fill='none' stroke='%23d8a657' stroke-width='2'/%3E%3Cpath d='M6 13h20M13 5v22' stroke='%23d8a657' stroke-width='2'/%3E%3C/svg%3E"
    />
    <script src="auth-handler.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#ds-view">Saltar para o conteudo</a>

    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">DS</span>
          <span>
            <span class="brand-name">Dark Studio</span>
            <span class="brand-sub">Composicao de video</span>
          </span>
        </div>

        <nav aria-label="Seccoes da aplicacao">
          <p class="nav-label" id="ds-nav-label">Fluxo de trabalho</p>
          <div class="nav-list" id="ds-nav" aria-describedby="ds-nav-label"></div>
        </nav>

        <div class="sidebar-foot">
          <span><span class="dot"></span>Motor local: HyperFrames + Whisper</span>
          <span>Atalhos: Alt+1 ate Alt+7</span>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <p class="crumb">Dark Studio / <strong id="ds-crumb">Painel</strong></p>
          <span class="topbar-spacer"></span>
          <div class="row" id="ds-status" aria-live="polite"></div>
        </header>

        <main id="ds-view" class="page" tabindex="-1" aria-live="polite"></main>
      </div>
    </div>

    <noscript>
      <p style="padding: 24px">
        O Dark Studio precisa de JavaScript. Active-o nas definicoes do navegador para usar a
        aplicacao.
      </p>
    </noscript>
  </body>
</html>
