[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
# WHY: the 9 tests in tests/test_live_providers.py call OpenRouter, Pexels and
# Pixabay over the real network with the API keys in your environment. A plain
# `pytest` would silently spend real money and trip real rate limits, so `live`
# is deselected by default. Do NOT remove the -m below to "fix" a red build --
# the 9 live tests are green, they are just excluded on purpose.
#
# HOW TO RUN THEM (both are intentional, both really hit the network):
#   pytest -m live                      # opt back in: only the 9 live tests
#   pytest -m "not live"                # explicit form of this default
#   pytest -m "not live and not slow"   # offline suite, also skips slow renders
#
# Why this is not a trap: pytest prepends addopts to the command line
# (Config._initini does `args[:] = getini("addopts") + args`) and -m is a plain
# argparse "store" option, so the LAST -m on the effective command line wins.
# An explicit `-m live` therefore overrides this default instead of being
# swallowed by it.
addopts = -m "not live"
markers =
    slow: marks tests as slow (deselected by -m "not slow")
    live: hits real external AI/media providers; deselected by default, run with -m live
